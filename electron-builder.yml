appId: com.msingh.sukhi.play
productName: Sukhi Play
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# Predictable, self-describing filenames so a parent can tell at a glance which
# download is theirs.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

files:
  - src/**/*
  - config/**/*
  # The apps that ship inside the download. Only the built output: the patch
  # and build scripts beside it are for rebuilding, not for running.
  # Ours under apps/, everybody else's under vendor/.
  - apps/*/app/**/*
  - apps/*/LICENSE
  - vendor/*/app/**/*
  - vendor/*/LICENSE
  - vendor/*/UPSTREAM
  - package.json
  - "!**/*.map"

# Nothing in this app talks to an update server; a kiosk app that can rewrite
# itself is a bigger risk than an out-of-date one.
publish: null

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signed, not Developer ID signed, so no hardened runtime and no
  # notarisation. "-" is the ad-hoc identity: electron-builder signs through
  # @electron/osx-sign, which knows the order Electron's frameworks and helper
  # apps have to be signed in.
  #
  # `identity: null` skipped signing altogether, which left Electron's own
  # linker signature in place over a bundle electron-builder had already
  # renamed and rewritten. macOS reports that invalid signature as
  # "Sukhi Play.app is damaged and can't be opened".
  identity: "-"
  # Off deliberately. Hardened runtime exists to satisfy notarisation, and
  # these builds are not notarised. Combined with an ad-hoc signature it turns
  # on library validation, which can stop the app loading Electron's own
  # dylibs -- electron-builder warns about exactly this.
  hardenedRuntime: false
  icon: build/icon.png
  darkModeSupport: true
  # No entitlements needed: no camera, mic, or file access is ever requested.
  extendInfo:
    LSApplicationCategoryType: public.app-category.education

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

deb:
  # A .deb control file has nowhere to put a licence, a developer name or a
  # release date, which is why Ubuntu's App Center reported all three as
  # unknown. Software centres read that from AppStream metadata instead, and
  # electron-builder does not generate it, so scripts/make-metainfo.js does and
  # fpm places it where the centres look.
  fpm:
    - "build/linux/com.msingh.sukhi.play.metainfo.xml=/usr/share/metainfo/com.msingh.sukhi.play.metainfo.xml"
    # Debian policy requires this; the package shipped only a changelog.
    - "build/linux/copyright=/usr/share/doc/sukhi-play/copyright"

# Microsoft Store package. Built only by `npm run dist:win:store`, never by the
# release workflow: the Store re-signs and hosts it, and the GitHub downloads
# stay the NSIS installer and portable exe.
#
# identityName, publisher and publisherDisplayName must be copied exactly from
# Partner Center (the app's Product identity page) once the name is reserved.
# Until then electron-builder's placeholders let the package build, but the
# Store will reject an upload whose identity does not match.
appx:
  applicationId: SukhiPlay
  displayName: Sukhi Play
  backgroundColor: transparent
  showNameOnTiles: true
  languages: [en-GB, en-US]
  artifactName: ${productName}-${version}-store-${arch}.${ext}

nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sukhi Play

linux:
  # Debian requires a maintainer. Note that it is embedded in the package and
  # readable by anyone who installs it.
  maintainer: Mandeep Singh <mesingh90@gmail.com>
  syncDesktopName: true
  synopsis: A locked-down browser that lets a small child open only what you choose
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # A directory of NxN.png files, not a single image: a lone 1024x1024 entry is
  # not matched by the icon theme and Ubuntu falls back to a generic icon.
  icon: build/icons
  category: Education
  desktop:
    entry:
      Name: Sukhi Play
      Categories: Education;Game;

# Snap, for the Ubuntu App Center listing. Strict confinement on purpose: it is
# what makes the store show restricted rather than unrestricted permissions.
#
# One consequence to know about. Under strict confinement the app cannot write
# to the host's dconf, so the GNOME shortcut borrowing in src/main/gnome.js
# (Alt+Tab, the Super key) does not apply. gnome.available() detects that and
# skips it, so nothing breaks -- but that one lockdown layer is absent in the
# snap and present in the .deb.
# Deprecated in favour of `snapcraft.<core>`, and staying here on purpose.
#
# The migration to snapcraft.core24 was tried and reverted. core24 builds
# inside a container, and neither route works on a GitHub runner:
# destructive mode cannot be used with the gnome extension Electron needs for
# its GTK runtime, and an LXD container comes up with no outbound network
# because Docker's iptables rules on the runner conflict with LXD's bridge.
# This block builds from a prebuilt template with no container at all, works
# the same locally and in CI, and has shipped every revision so far.
#
# The real pressure is not the deprecation warning. This template pins
# base: core20, which is Ubuntu 20.04, and the Snap Store will not accept it
# forever. When core20 is retired, or electron-builder actually removes this
# block, the migration has to happen and the LXD networking problem has to be
# solved: `sudo iptables -P FORWARD ACCEPT` on the runner is the documented
# fix for it and was not tried.
#
# Run `gh workflow run packaging.yml` to test any change before tagging: a snap
# cannot be built on macOS at all.
snap:
  confinement: strict
  grade: stable
  autoStart: false
  # These travel inside the snap, but do NOT assume they reach the store. The
  # Snap Store adopts a snap's metadata on upload only until the publisher
  # makes a manual change to the listing, after which the listing is
  # authoritative and uploads no longer touch it. This listing has been edited
  # by hand, so these values apply only to a fresh listing, or if someone runs
  # `snapcraft upload-metadata --force` to push them deliberately. Do not put
  # that in CI: it would overwrite the longer description in
  # docs/store-description.md every release.
  #
  # Licence, links, icon and screenshots were never carried by the snap at
  # all. The format has no screenshots field, and the listing icon comes from
  # an icon: key in snapcraft.yaml that electron-builder does not always
  # write. Set those four on the store listing page.
  title: Sukhi Play
  summary: Let a small child open only the sites you choose
  category: Education
  description: |
    Sukhi Play turns a computer into a safe place for a small child to play.

    A grown-up chooses which sites are allowed. The child gets a full screen of
    large, brightly coloured buttons and nothing else: no address bar, no tabs,
    no other websites, no popups, and no way out without an adult.

    Everything outside the approved list is blocked, along with ads and
    trackers. Keyboard shortcuts are neutralised so a child mashing keys cannot
    escape or break anything, while the arrow keys and letters games need keep
    working. Closing the app takes a sustained press a toddler will not manage.

    Sukhi Play is not affiliated with any of the sites it can open and does not
    endorse them. You choose where it may go and are responsible for complying
    with each site's terms.
  # No `plugs` override. electron-builder's `default` already expands to
  # desktop, desktop-legacy, home, x11, wayland, unity7, browser-support,
  # network, gsettings, audio-playback, pulseaudio and opengl. Listing
  # audio-playback on top of `default` produced a duplicate, and the store
  # rejects the upload: "$.apps.sukhi-play.plugs ... has non-unique elements".
  #
  # Snap artifacts are named without spaces, unlike the other targets: the
  # store tooling and the documented upload command both expect the
  # name_version_arch form.
  artifactName: ${name}_${version}_${arch}.snap
