name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a way to escape the kiosk or get past the exit gate, please
        do not post details here , see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: The game closed itself and went back to the tile screen.
    validations: { required: true }

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations: { required: true }

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap the second tile
        3. Play for about a minute
    validations: { required: true }

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, "Windows 10", "Windows 11", "Ubuntu / Debian", "Other Linux"]
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Sukhi Play version
      placeholder: "1.0.0 , shown at the bottom of the tile screen"
    validations: { required: true }

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: ["Downloaded a release", "Built from source", "Other"]
    validations: { required: true }

  - type: textarea
    id: check
    attributes:
      label: Output of `npm run check` (if you built from source)
      description: Only if the problem is a site not loading properly.
      render: shell
