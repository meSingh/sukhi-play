name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tests must pass before anything is published
        run: npm test

      - id: v
        name: Tag and package.json must agree
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION  package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION."
            echo "::error::Bump the version in package.json and re-tag."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: dist:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            name: Windows
            script: dist:win
            artifacts: |
              dist/*.exe
          - os: ubuntu-latest
            name: Linux
            script: dist:linux:all
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        # snapcraft is needed at build time, not just at upload time:
        # `electron-builder --linux snap` shells out to it, and without it the
        # whole Linux build fails with `spawn snapcraft ENOENT`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm
          sudo snap install snapcraft --classic

      - name: Install
        run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. See the README for what users will see on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List what was produced
        shell: bash
        run: ls -lh dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` block is not visible to
    # that step's `if`, so the guard below would never see the credential.
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/ \;
          # Version-free copies of the two macOS disk images, so
          # /releases/latest/download/<name> is a permanent link that docs and
          # buttons can point at. Every other asset keeps its versioned name.
          cd release
          for pair in "mac-arm64.dmg:Sukhi-Play-macOS-AppleSilicon.dmg" \
                      "mac-x64.dmg:Sukhi-Play-macOS-Intel.dmg" \
                      "win-x64-setup.exe:Sukhi-Play-Windows-Setup.exe" \
                      "win-x64.exe:Sukhi-Play-Windows-Portable.exe"; do
            match=${pair%%:*}; alias=${pair##*:}
            src=$(find . -maxdepth 1 -name "*${match}" -print -quit)
            if [ -z "$src" ]; then
              echo "::error::no artifact matching ${match}"
              exit 1
            fi
            cp "$src" "$alias"
            echo "aliased $(basename "$src") -> $alias"
          done

          ls -lh
          sha256sum * > SHA256SUMS.txt
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - name: Publish the snap to the Snap Store
        # Reuses the snap the build job already produced, rather than a second
        # build definition in the repository. Snapcraft's GitHub integration
        # wants a snapcraft.yaml at the repo root and builds from source on
        # Launchpad, which would mean maintaining a parallel recipe that could
        # drift from the electron-builder one that is known to work.
        #
        # Skipped rather than failed when the credential is absent, so a fork
        # or a run without the secret still publishes a GitHub release.
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          snap=$(find artifacts -name '*.snap' -print -quit)
          if [ -z "$snap" ]; then
            echo "::error::no .snap in the build artifacts"
            exit 1
          fi
          sudo snap install snapcraft --classic || true
          snapcraft upload --release=stable "$snap"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sukhi Play ${{ needs.verify.outputs.version }}
          draft: false
          generate_release_notes: true
          files: release/*
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | **macOS** (Apple Silicon) | `Sukhi-Play-macOS-AppleSilicon.dmg` |
            | **macOS** (Intel) | `Sukhi-Play-macOS-Intel.dmg` |
            | **Windows 10/11** | `Sukhi-Play-Windows-Setup.exe`, or `-Portable.exe` |
            | **Ubuntu / Debian** | `.deb`, or `sudo snap install sukhi-play` |
            | **Other Linux** | `.AppImage` (`chmod +x`, then run) |

            The two macOS names above are permanent links that always point at
            the newest release. The same disk images are also listed with their
            version numbers. `SHA256SUMS.txt` covers every file.

            ### macOS blocks the first launch

            These builds are signed but not notarised, so macOS says *"Apple
            could not verify Sukhi Play is free of malware"*. Control-clicking
            the app and choosing *Open* used to work, but macOS 15 removed
            that. Instead:

            1. Try to open it once and click **Done**.
            2. **System Settings**, then **Privacy & Security**.
            3. Scroll to **Security** at the bottom, click **Open Anyway**.

            Once per install. Full walkthrough:
            [docs/macos.md](https://github.com/${{ github.repository }}/blob/main/docs/macos.md).

            ### Windows blocks the first run too

            SmartScreen shows *"Windows protected your PC"*. Click **More
            info**, then **Run anyway**. The button only appears after More
            info, which is easy to miss.
            [docs/windows.md](https://github.com/${{ github.repository }}/blob/main/docs/windows.md)
            has the detail, including how to check the download's hash.

            Notarising needs a paid Apple Developer account and Windows wants an
            EV certificate, both annual, and this is a free project. Verify the
            checksum if you want to be sure what you downloaded.

            ### Before you hand it to a child

            Sukhi Play ships with **nothing enabled**. Open the grown-up screen
            and add the sites you want, by typing an address or picking from the
            suggestions. See the README, and please read
            [DISCLAIMER.md](https://github.com/${{ github.repository }}/blob/main/DISCLAIMER.md).
