name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tests must pass before anything is published
        run: npm test

      - id: v
        name: Tag and package.json must agree
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION  package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION."
            echo "::error::Bump the version in package.json and re-tag."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: dist:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            name: Windows
            script: dist:win
            artifacts: |
              dist/*.exe
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      - name: Install
        run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. See the README for what users will see on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List what was produced
        shell: bash
        run: ls -lh dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release
          ls -lh
          sha256sum * > SHA256SUMS.txt
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sukhi Play ${{ needs.verify.outputs.version }}
          draft: false
          generate_release_notes: true
          files: release/*
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | **macOS** (Apple Silicon) | `.dmg` with `arm64` in the name |
            | **macOS** (Intel) | `.dmg` with `x64` in the name |
            | **Windows 10/11** | `.exe` installer, or the portable `.exe` |
            | **Ubuntu / Debian** | `.deb` |
            | **Other Linux** | `.AppImage` (`chmod +x`, then run) |

            `SHA256SUMS.txt` lists the checksum of every file.

            ### These builds are not code-signed

            - **macOS** will refuse the first launch. Right-click the app and
              choose *Open*, then confirm.
            - **Windows** SmartScreen will warn. Choose *More info* →
              *Run anyway*.

            Signing certificates cost money per year; this is a free project.
            Verify the checksum if you want to be sure of what you downloaded.

            ### Before you hand it to a child

            Sukhi Play ships with **no website enabled**. Open the grown-up
            screen, edit `catalog.json`, and add the sites you want. See the
            README, and please read
            [DISCLAIMER.md](https://github.com/${{ github.repository }}/blob/main/DISCLAIMER.md).
