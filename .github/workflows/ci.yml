name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Electron binary is not needed to run the unit tests, and skipping
      # the ~100MB download keeps CI quick.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Unit tests
        run: npm test

      - name: Syntax check every source file
        shell: bash
        run: |
          set -e
          for f in src/main/*.js src/preload/*.js src/renderer/app.js test/*.js; do
            node --check "$f"
          done
          echo "all source files parse"

      - name: Validate JSON and build config
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/catalog.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          echo "config files are valid"

      - name: Suggestions must be valid and none may ship enabled
        shell: bash
        run: |
          node -e "
            const lib = require('./src/main/library');
            const list = lib.loadSuggestions('config/suggestions.json');
            if (!list.length) { console.error('suggestions.json produced nothing usable'); process.exit(1); }
            const on = list.filter(s => s.enabled);
            if (on.length) {
              console.error('Suggestions must never ship enabled: ' + on.map(s=>s.id).join(', '));
              process.exit(1);
            }
            const noHosts = list.filter(s => !s.allowHosts.length);
            if (noHosts.length) {
              console.error('Suggestions without an allowlist: ' + noHosts.map(s=>s.id).join(', '));
              process.exit(1);
            }
            console.log(list.length + ' suggestions, all valid, none enabled');
          "

      - name: The shipped catalog must not enable any site
        shell: bash
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('config/catalog.json','utf8'));
            const on = (c.apps || []).filter(a => a.enabled !== false);
            if (on.length) {
              console.error('Shipped catalog enables ' + on.length + ' site(s): ' + on.map(a=>a.id).join(', '));
              console.error('Sukhi Play must ship with an empty launcher. See DISCLAIMER.md.');
              process.exit(1);
            }
            console.log('catalog ships with nothing enabled');
          "
