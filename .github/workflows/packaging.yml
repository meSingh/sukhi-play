name: Packaging smoke test

# Builds the Linux packages without publishing anything.
#
# The release workflow is the only other thing that builds a snap, and running
# it publishes: it updates the GitHub release and pushes a revision to the Snap
# Store. That makes it useless for checking a packaging change. This does the
# build, inspects what came out, and throws it away.
#
# Run it from the Actions tab before changing anything under snapcraft: or
# electron-builder.yml, since a snap cannot be built on macOS at all.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron-builder.yml'
      - 'package.json'
      - '.github/workflows/packaging.yml'

jobs:
  # Windows left the taskbar visible over the kiosk, and there is no way to
  # tell from macOS whether the window is the wrong size or the taskbar is
  # simply drawn over a correct one. A runner has a desktop session, so the
  # probe can answer that with real numbers.
  windows-cover:
    name: What Windows lets the app hold
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Probe every covering strategy
        run: npm run cover-probe
        timeout-minutes: 5

      - name: Probe which accelerators Windows hands over
        run: npm run key-probe
        timeout-minutes: 5

      # Presses the Windows key over the running kiosk and checks the Start
      # menu is closed and the kiosk is back in front each time.
      - name: Does the Start menu get closed
        run: npm run start-probe
        timeout-minutes: 5
        env:
          SUKHI_EXIT_AFTER: '90'

  # A build to try on a real Windows 11 machine, where the Start menu behaves
  # like it does at home. Download it from this run's artifacts.
  windows-test-build:
    name: Windows test build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the installer and portable exe
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-build
          path: |
            dist/*-setup.exe
            dist/*-win-x64.exe
          retention-days: 7

  # The Microsoft Store package can only be built on Windows. Building it here
  # proves the manifest and tile assets are valid before anything is uploaded
  # to Partner Center, which reports problems far more slowly.
  windows-store:
    name: Build the Microsoft Store package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the .appx
        run: npm run dist:win:store

      - name: What came out
        shell: bash
        run: |
          set -e
          ls -lh dist/
          pkg=$(find dist -maxdepth 1 -name '*.appx' -print -quit)
          if [ -z "$pkg" ]; then
            echo "::error::no .appx was produced"
            exit 1
          fi
          echo "built $pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/*.appx
          retention-days: 7

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm
          sudo snap install snapcraft --classic

      - name: Install
        run: npm ci

      - name: Build AppImage, deb and snap
        run: npm run dist:linux:all

      - name: What came out
        run: ls -lh dist/

      - name: The snap must exist and carry its metadata
        # electron-builder can report success while producing a snap whose
        # metadata never made it in, which is invisible until the store listing
        # comes back bare.
        run: |
          set -e
          snap=$(find dist -name '*.snap' -print -quit)
          if [ -z "$snap" ]; then
            echo "::error::no .snap was produced"
            exit 1
          fi
          echo "built $snap"

          sudo unsquashfs -q -d /tmp/snapx "$snap" meta
          echo "--- meta/snap.yaml ---"
          cat /tmp/snapx/meta/snap.yaml

          for field in "^name:" "^version:" "^summary:" "^confinement: strict" "^base:"; do
            if ! grep -qE "$field" /tmp/snapx/meta/snap.yaml; then
              echo "::error::meta/snap.yaml is missing $field"
              exit 1
            fi
          done

          # The duplicate that got an upload rejected by the store.
          plugs=$(grep -oP '(?<=- )\w[\w-]*' /tmp/snapx/meta/snap.yaml | sort)
          if [ "$(echo "$plugs" | wc -l)" != "$(echo "$plugs" | uniq | wc -l)" ]; then
            echo "::error::duplicate entries in snap.yaml; the store rejects these"
            echo "$plugs" | uniq -d
            exit 1
          fi
          echo "snap metadata looks sane"

      # Everything above checks that a snap was produced and that its metadata
      # reads correctly. None of that notices a snap that cannot start, which
      # is what shipped in 2.0.1: the launcher scripts were missing and bash
      # exited 127 before Electron ran. So install it and run it.
      - name: The snap must actually start
        run: |
          set -e
          snap=$(find dist -name '*.snap' -print -quit)
          sudo snap install --dangerous "$snap"

          echo "--- what is at the snap root ---"
          ls /snap/sukhi-play/current/

          # command.sh exec's these three. A packed template leaves none of
          # them behind, and the failure is invisible until somebody installs it.
          for f in desktop-init.sh desktop-common.sh desktop-gnome-specific.sh; do
            if [ ! -x "/snap/sukhi-play/current/$f" ]; then
              echo "::error::/$f is missing from the snap; command.sh will exit 127"
              exit 1
            fi
          done

          # The template arriving whole rather than unpacked is the specific
          # way this broke, and it leaves its own fingerprint.
          if ls /snap/sukhi-play/current/*.tar >/dev/null 2>&1; then
            echo "::error::an unextracted template tarball is inside the snap"
            exit 1
          fi

          sudo apt-get install -y -qq xvfb
          set +e
          timeout 90 xvfb-run -a snap run sukhi-play --diagnose 2>&1 | tee /tmp/snap-run.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code"

          # --diagnose prints where the window landed and quits, so a healthy
          # run ends on its own. A timeout kill (124) means it got far enough
          # to open a window and stay up, which is still a pass for "it starts".
          if [ "$code" != "0" ] && [ "$code" != "124" ]; then
            echo "::error::the snap failed to start (exit $code)"
            exit 1
          fi
          if grep -qE 'No such file or directory|error while loading shared libraries' /tmp/snap-run.log; then
            echo "::error::the snap started but could not find something it needs"
            exit 1
          fi
          echo "the snap starts"

      - name: The deb must carry its metainfo and copyright
        run: |
          set -e
          deb=$(find dist -name '*.deb' -print -quit)
          dpkg-deb -c "$deb" | grep -E 'metainfo|doc/sukhi-play/copyright' || {
            echo "::error::deb is missing metainfo or copyright"
            exit 1
          }
          echo "--- deb control ---"
          dpkg-deb -f "$deb" Package Version Maintainer Homepage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.snap
            dist/*.deb
            dist/*.AppImage
          retention-days: 3
