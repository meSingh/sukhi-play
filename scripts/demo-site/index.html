<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shapes</title>
<style>
  /* A small page of our own, served from 127.0.0.1 while the demo records.
     The recording needs a site open to show what a child actually sees, and
     using somebody else's site to advertise this one would be taking a
     liberty with their brand. */
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 20% 15%, #FFE9B8, #FFF7EC 55%);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; overflow: hidden;
  }
  h1 { margin: 0; font-size: 40px; font-weight: 900; color: #17153A; letter-spacing: -1px; }
  .row { display: flex; gap: 34px; }
  .shape {
    width: 150px; height: 150px;
    border: none; cursor: pointer;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.14), 0 12px 0 rgba(23,21,58,.12);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .shape:active { transform: scale(.9); }
  .pop { animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 40% { transform: scale(1.22) rotate(-6deg); } }
  /* A little constant movement: the recorder takes painted frames, and a page
     that never repaints produces nothing to record. */
  .shape { animation: float 3.2s ease-in-out infinite; }
  .shape:nth-child(2) { animation-delay: .4s; }
  .shape:nth-child(3) { animation-delay: .8s; }
  .shape:nth-child(4) { animation-delay: 1.2s; }
  @keyframes float { 50% { translate: 0 -18px; } }
  .circle { border-radius: 50%; background: #3B6BFF; }
  .square { border-radius: 30px; background: #FFBE18; }
  .heart  { border-radius: 50% 50% 12px 12px; background: #FF5C5C; transform: rotate(45deg); }
  .heart.pop { animation: popheart .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popheart { 40% { transform: rotate(45deg) scale(1.22); } }
  .star   { border-radius: 26px; background: #10D6A0; }
  .score { font-size: 26px; font-weight: 900; color: #5B5885; }
</style>
</head>
<body>
  <h1>Tap the shapes!</h1>
  <div class="row">
    <button class="shape circle" aria-label="circle"></button>
    <button class="shape square" aria-label="square"></button>
    <button class="shape heart" aria-label="heart"></button>
    <button class="shape star" aria-label="star"></button>
  </div>
  <p class="score">Tapped <span id="n">0</span></p>
<script>
  // A page like the ones children land on: it asks for adverts and trackers.
  // Every one of these is refused by the app, which is what the counter in the
  // bar is counting. Nothing loads; the requests exist to be blocked.
  ['https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js',
   'https://www.google-analytics.com/analytics.js',
   'https://securepubads.g.doubleclick.net/tag/js/gpt.js',
   'https://sb.scorecardresearch.com/beacon.js',
   'https://static.doubleclick.net/instream/ad_status.js'].forEach(function (src, i) {
    setTimeout(function () {
      var s = document.createElement('script');
      s.src = src;
      s.onerror = function () { /* refused, which is the point */ };
      document.head.appendChild(s);
    }, 400 + i * 700);
  });

  var n = 0;
  document.querySelectorAll('.shape').forEach(function (el) {
    el.addEventListener('click', function () {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
      document.getElementById('n').textContent = ++n;
    });
  });
</script>
</body>
</html>
